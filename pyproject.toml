# Tool configuration only; wake is installed with install.sh, not pip.

[tool.ruff]
target-version = "py39"
line-length = 120
# the commands in bin/ are Python scripts without a .py suffix
extend-include = ["bin/wake", "bin/wake-hook", "bin/wake-inbox-io", "bin/wake-mcp", "bin/wake-run"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long strings and help texts; the formatter handles code layout
]

[tool.ruff.lint.isort]
known-first-party = ["wake_config"]
