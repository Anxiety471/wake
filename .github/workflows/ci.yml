name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    # pinned, not ubuntu-latest: 3.9 has no build for the newest image (Ubuntu 26.04)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: tests/run.sh
        env:
          PYTHON: python

  api:
    name: api (bun)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wake_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wake_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/wake_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # eslint 10 uses util.styleText, which bun does not implement; node runs it
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff==0.17.5
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: shellcheck
        run: shellcheck install.sh tests/run.sh scripts/scrub-check.sh bin/ops/wake-api-e2e bin/ops/wake-gate-check bin/ops/wake-keys bin/ops/wake-pg bin/ops/wake-pingall
      - name: compileall
        run: |
          python -m compileall -q bin tests
          for f in bin/wake bin/wake-hook bin/wake-inbox-io bin/wake-mcp bin/wake-run; do
            python -m py_compile "$f"
          done

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan tracked files and history
        run: scripts/scrub-check.sh --history