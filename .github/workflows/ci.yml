name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    # pinned, not ubuntu-latest: 3.9 has no build for the newest image (Ubuntu 26.04)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      # Full history and tags: tests/test_publish_checklist.py compares the release line in
      # docs/PUBLISH-CHECKLIST.md with what the tag resolves to, and a one-commit clone has no
      # tag to resolve. The repository is small; the other jobs keep the shallow default.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: tests/run.sh
        env:
          PYTHON: python

  # The suite ran in the foreground only, so a test that depends on the shell's SIGINT
  # disposition was green here and failed for anyone who ran it as a background job (#142).
  # POSIX starts a background job of a non-interactive shell with SIGINT ignored, Python keeps
  # the inherited SIG_IGN, and bash cannot trap a signal that was ignored on entry. This job
  # runs the suite in exactly that shape, so deleting the test's preexec_fn now fails a check.
  backgrounded:
    # No workflow key but name, on, permissions and jobs (a top-level `defaults` swaps the shell
    # for every run step in the file), no job key but these three, no step key but `run` and `env`,
    # no `if` or `continue-on-error` on a step - at the step's indent, on its dash line
    # (`- if: false`) or behind a YAML anchor (`- &a if: false`) - the run body is exactly the two
    # commands, and the env block is exactly `PYTHON: python`: any one of them turns this check
    # back into the blindness #142 was filed about - a failed suite reported as neutral, the run
    # step skipped, `shell:` swapping out the interpreter, `exit 0` above the suite, or
    # `PYTHON: /bin/true` running nothing. tests/test_ops_scripts.py pins all of it (#152, #141).
    name: test (backgrounded shell, Python 3.13)
    runs-on: ubuntu-24.04
    steps:
      # Full history and tags, as in the matrix job: the publish checklist resolves the tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run tests as a background job
        # wait $! and not a bare wait: a bare wait reports zero even when the suite failed.
        run: |
          tests/run.sh &
          wait $!
        env:
          PYTHON: python

  api:
    name: api (bun)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wake_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wake_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/wake_test
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # eslint 10 uses util.styleText, which bun does not implement; node runs it
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        run: bun install --frozen-lockfile
      # The inline pin's control: tests.test_inline_suppressions proves that one eslint-disable
      # line takes eslint from rc 1 to rc 0, and a prettier-ignore the formatter half. Both tests
      # skip without node_modules, which every other job lacks, so this job runs them and fails
      # if the linters are missing rather than skipping the control (#216).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Inline suppressions bite
        env:
          WAKE_REQUIRE_LINTERS: "1"
        run: python3 -m unittest tests.test_inline_suppressions
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      # #63: the threads e2e has never run in CI, so a PR could change the boot rule and still
      # show every check green. It gets a database of its own: the script registers agents and
      # expects its own thread list, so it must not share wake_test with the suite above. The
      # database is created empty on purpose - the API applies its migrations on first use.
      - name: End-to-end threads over HTTP
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/wake_e2e_test
        run: |
          bun -e 'import { Client } from "pg";
          const client = new Client({ connectionString: "postgres://postgres:postgres@127.0.0.1:5432/postgres" });
          await client.connect();
          await client.query("DROP DATABASE IF EXISTS wake_e2e_test");
          await client.query("CREATE DATABASE wake_e2e_test");
          await client.end();'
          bun scripts/e2e-threads.ts

  lint:
    # Pinned, not ubuntu-latest (#174): lint's verdict comes from the runner's own shellcheck
    # and python, so a floating image - or a self-hosted one - changes what it reads while
    # every check in the suite stays green. Bumping this is deliberate, with the test's value.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff==0.17.5
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: shellcheck
        run: shellcheck install.sh tests/run.sh scripts/scrub-check.sh scripts/changelog-guard.sh $(grep -lE '^#!/(usr/)?bin/(env )?(ba)?sh' bin/ops/wake-* bin/wake*)
      - name: compileall
        run: |
          python -m compileall -q bin tests
          for f in bin/wake bin/wake-hook bin/wake-inbox-io bin/wake-mcp bin/wake-run; do
            python -m py_compile "$f"
          done
      # #199: nothing read CHANGELOG.md, so a conflict resolution that takes the branch's copy
      # deleted a released bullet and every check stayed green. The guard compares the pull
      # request's base revision with this checkout and fails on any line the base still carries
      # unless that exact line is listed in scripts/changelog-allow.txt with a reason above it.
      # A push has no pull request base, so the step says that instead of comparing nothing.
      - name: CHANGELOG.md deletions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "changelog-guard: not a pull request; nothing to compare"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          scripts/changelog-guard.sh "$BASE_SHA"

  secret-scan:
    # Pinned, not ubuntu-latest (#172): the scan's verdict comes from the runner's git and grep,
    # so a floating image - or a self-hosted one - can change what it reads while every check in
    # the suite stays green. Bumping this is deliberate, with the test's expected value.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan tracked files and history
        run: scripts/scrub-check.sh --history-head
